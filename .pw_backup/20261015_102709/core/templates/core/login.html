{% extends "core/base.html" %}
{% block title %}Login — Dandiya Delight{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-side">
    <svg class="bgm" aria-hidden="true"><use href="#mandala"/></svg>
    <h2>Welcome! 🪔</h2>
    <p>Join in seconds and meet your garba partner.</p>
    <ul><li><svg class="ic"><use href="#i-shield"/></svg>Quick &amp; simple sign up</li>
        <li><svg class="ic"><use href="#i-lock"/></svg>You choose who can message you</li>
        <li><svg class="ic"><use href="#i-heart"/></svg>100% free</li></ul>
  </div>
  <div class="auth-form">
    <h2>Login / Sign up</h2>
    <form method="post">{% csrf_token %}
      <label>Your name</label><input name="name" required maxlength="50" placeholder="e.g. Riya">
      <label>WhatsApp number</label><input name="phone" required inputmode="tel" placeholder="9876543210 or +919876543210">
      <button class="btn" style="width:100%">Continue <svg class="ic"><use href="#i-arrow"/></svg></button>
    </form>
  </div>
</div>
{% endblock %}
